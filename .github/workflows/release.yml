# Publica una versión de LFind por cada push a `main` con cambios de código.
#
# Versión: MAYOR.MENOR de tauri.conf.json + número de ejecución de este workflow (ver scripts/release/lib.mjs). Se inyecta al compilar:
# no se hace ningún commit automático, así que no puede haber ciclos.
#
# Una instalación solo ve una versión nueva cuando su manifiesto `latest.json` queda publicado. Por eso la release se crea como
# borrador con todos sus archivos y se publica en el último paso: si algo falla antes, no existe para los usuarios.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

# Una publicación detrás de otra, sin cancelar: el orden de ejecución es el orden de versiones.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    # Una ejecución manual desde otra rama no debe poder publicar.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # crear la release y subir sus archivos
    defaults:
      run:
        shell: bash
    env:
      # Si las versiones se publican en otro repositorio público, cambiar aquí y añadir un token con acceso a él.
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Comprobar la configuración de firma
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Faltan los secrets de firma. No se publica nada sin firma (ver DEVELOPMENT_GUIDE.md)."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        run: rustup default stable

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            crates/nova-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'crates/nova-core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Pruebas de frontend
        run: npm test

      - name: Pruebas de Rust
        run: cargo test --manifest-path crates/nova-core/Cargo.toml --features sqlite --locked

      # El token con permiso de escritura solo está en los pasos que lo usan: las dependencias que se instalan o compilan no lo ven.
      - name: Calcular la versión
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo "$RELEASE_REPO" --json tagName --jq .tagName 2>/dev/null || true)"
          version="$(node scripts/release/cli.mjs version "$GITHUB_RUN_NUMBER" "$latest")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión $version (publicada hasta ahora: ${latest:-ninguna})"

      - name: Compilar y firmar
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Un salto de línea al pegar el Secret haría fallar la firma. Ni la clave ni la contraseña contienen saltos.
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$RAW_KEY" | tr -d '\r\n')"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$TAURI_SIGNING_PRIVATE_KEY"
          echo "::add-mask::$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          npx tauri build --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"

      - name: Verificar los artefactos
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir=src-tauri/target/release/bundle/nsis
          installer="$dir/LFind_${VERSION}_x64-setup.exe"
          test -s "$installer"
          test -s "$installer.sig"
          # La firma debe corresponder a la clave pública que llevan las instalaciones.
          node scripts/release/cli.mjs verify "$installer" "$installer.sig"
          url="https://github.com/$RELEASE_REPO/releases/download/v$VERSION/$(basename "$installer")"
          node scripts/release/cli.mjs manifest "$VERSION" "$installer" "$installer.sig" "$url" latest.json
          test -s latest.json
          echo "installer=$installer" >> "$GITHUB_OUTPUT"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: ${{ steps.artifacts.outputs.installer }}
        run: |
          tag="v$VERSION"
          # Un reintento puede encontrar el borrador de un intento anterior; una release ya publicada nunca se toca.
          if [ "$(gh release view "$tag" --repo "$RELEASE_REPO" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$tag" --repo "$RELEASE_REPO" --yes
          fi
          node -p "JSON.parse(require('fs').readFileSync('latest.json','utf8')).notes" > release-notes.txt
          gh release create "$tag" "$INSTALLER" "$INSTALLER.sig" latest.json \
            --repo "$RELEASE_REPO" --target "$GITHUB_SHA" --draft --title "LFind $VERSION" --notes-file release-notes.txt
          count="$(gh release view "$tag" --repo "$RELEASE_REPO" --json assets --jq '.assets | length')"
          if [ "$count" != "3" ]; then
            echo "::error::La release tiene $count archivos en lugar de 3: queda como borrador."
            exit 1
          fi
          gh release edit "$tag" --repo "$RELEASE_REPO" --draft=false --latest
