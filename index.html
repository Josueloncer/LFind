<!doctype html>
<html lang="es" data-theme="dark" data-vibrancy="off">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>LFind</title>
    <!-- Fondo inmediato: se pinta antes de que cargue ningún JS/CSS de la app. -->

      html { background: #18191c; }
      html[data-theme="light"] { background: #e8e9ee; }
      html[data-theme="cyberpunk"] { background: #07060d; }

      html[data-vibrancy="on"][data-theme="dark"], html[data-vibrancy="on"][data-theme="light"] { background: transparent; }
      body { margin: 0; }
