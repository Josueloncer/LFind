[package]
name = "nova-explorer"
version = "0.1.0"
description = "LFind"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nova_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nova-core = { path = "../crates/nova-core", features = ["sqlite"] }
# Papelera de reciclaje (IFileOperation en Windows). Solo se usa desde la capa Tauri.
trash = "5"
tauri-plugin-updater = "2"
# Una sola instancia: abrir una carpeta desde Windows la lleva a la ventana existente y evita dos indexadores cruzados.
tauri-plugin-single-instance = "2"

# Soltar archivos de otras aplicaciones (Explorador, WinRAR…): WebView2 entrega sus rutas reales por
# `postMessageWithAdditionalObjects`. Son las mismas versiones que ya trae `wry`: no se descarga nada nuevo.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

# `tauri dev` compila en modo debug. En debug, serializar 100 000 entradas a JSON
# tarda ~221 ms frente a ~14 ms con optimización (medido con el banco de pruebas
# `crates/nova-core/examples/bench_dir.rs`, en Linux). Se optimiza solo el código
# propio y serde_json: no obliga a recompilar todo Tauri y mantiene la depuración.
[profile.dev.package.nova-core]
opt-level = 3
[profile.dev.package.nova-explorer]
opt-level = 2
[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Sin `panic = "abort"` a propósito: las miniaturas (y futuros decodificadores) necesitan `catch_unwind`. Fuera de esas fronteras
# el gancho de `nova_core::diagnostics` registra y aborta igualmente. Si se pusiera "abort", `nova-core` no compilaría.
strip = true
